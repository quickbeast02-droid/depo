name: 3D Shorts - preview and daily
on:
  workflow_dispatch:
# Paused: the current renderer does not meet the requested visual quality.
# Manual previews only until a new generative-video pipeline is tested.
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: System dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libegl1 libgl1 libopengl0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render 3D and Turkish neural audio
        env:
          TTS_VOICE: tr-TR-EmelNeural
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ENABLE_UPLOAD: ${{ vars.ENABLE_UPLOAD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python pipeline.py
      - name: Upload private preview artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Shorts-Preview
          path: preview.mp4
          retention-days: 14
      - name: Save titles of successful private uploads
        if: success() && github.event_name == 'schedule' && vars.ENABLE_UPLOAD == 'true'
        run: |
          if [ ! -f history.json ]; then
            echo 'No upload history to save.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record an uploaded Shorts story"
            git push
          fi
